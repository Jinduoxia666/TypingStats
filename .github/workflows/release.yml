name: Release DMG

# Push a version tag (e.g. `git tag v0.1.1 && git push origin v0.1.1`) to build
# the DMG and attach it to a GitHub Release. The app's short version comes from
# the tag, so it doesn't depend on Resources/Info.plist being bumped.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    # DashboardView uses macOS 26 APIs behind #available, so it needs the
    # macOS 26 SDK (Xcode 26+) to compile.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: make test

      # No signing.local.mk on the runner, so the app is ad-hoc signed.
      - name: Build DMG
        run: make dmg APP_VERSION="${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .build/TypingStats-*.dmg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
